seed: 42

dataset:
  height: 256
  width: 256
  channels: 20
  num_samples: 19937
  num_classes: 1

model:
  input_channels: 20
  num_classes: 1
  hidden_features: [64, 128, 256, 512]
  use_skip_connections: true
  use_activation_after_upsampling: false

training:
  batch_size: 16
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 4
  device: "auto"
  checkpoint_dir: "checkpoints"
  log_interval: 10
  use_cumuarea: false
  use_cumuarea_prev: true

comet:
  enabled: true
  project_name: ""
  workspace: ""
  experiment_name: "unet-baseline-01"
  experiment_tags: ["baseline", "20-channels", "3-classes"]