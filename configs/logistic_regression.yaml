seed: 42
run_name: "logistic-regression-all-channels"

data:
  # If unset, uses WILDFIRE_SAMPLE_FOLDER or configs/settings.py:SAMPLE_FOLDER.
  sample_folder:
  output_dir:
  cache_dir:

features:
  # Options: all_channels, no_satellite, environment_only
  feature_set: "all_channels"
  patch_size: 3

sampling:
  reuse_cache: true
  max_files_per_split:
    train:
    val:
    test:
  train:
    max_positive_pixels: 5000000
    negative_to_positive_ratio: 1

training:
  # W is the paper-style no-fire class-weight multiplier and is selected by validation AUC-PR.
  w_values: [1, 2, 3, 4, 5, 6, 7, 8]
  # Epochs are a fixed config input, not part of the W hyperparameter search.
  epochs: 1
  batch_size: 131072
  alpha: 0.0001
  penalty: "l2"
  learning_rate: "optimal"
  standardize: true

evaluation:
  threshold: 0.5
