seed: 42
run_name: "logistic-regression-smoke"

data:
  sample_folder:
  output_dir:
  cache_dir:

features:
  feature_set: "all_channels"
  patch_size: 3

sampling:
  reuse_cache: false
  max_files_per_split:
    train: 100
    val: 1
    test: 1
  train:
    max_positive_pixels: 100
    negative_to_positive_ratio: 1

training:
  w_values: [1, 2]
  epochs: 1
  batch_size: 256
  alpha: 0.0001
  penalty: "l2"
  learning_rate: "optimal"
  standardize: true

evaluation:
  threshold: 0.5
